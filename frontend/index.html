<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Riverbend Library Assistant</title>
<style>
  :root {
    --ink: #1d2b25;
    --paper: #f2ede2;
    --shelf: #2f4538;
    --shelf-dark: #223329;
    --amber: #c98a3e;
    --amber-dark: #a86f2c;
    --line: #d8cfb8;
    --user-bubble: #2f4538;
    --bot-bubble: #ffffff;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: "Iowan Old Style", "Georgia", serif;
    background: var(--paper);
    color: var(--ink);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    background: var(--shelf);
    color: var(--paper);
    padding: 18px 28px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    border-bottom: 4px solid var(--amber);
  }

  header h1 {
    font-size: 1.3rem;
    margin: 0;
    font-weight: 600;
    letter-spacing: 0.01em;
  }

  header .tag {
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 0.75rem;
    color: var(--amber);
    letter-spacing: 0.03em;
  }

  #status-bar {
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 0.75rem;
    padding: 6px 28px;
    background: var(--shelf-dark);
    color: #cfd9d1;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }

  #session-label {
    flex: 1;
    text-align: center;
    color: #9aa89c;
    font-variant-numeric: tabular-nums;
  }

  #status-bar button {
    background: none;
    border: 1px solid var(--amber);
    color: var(--amber);
    border-radius: 4px;
    padding: 3px 10px;
    font-family: inherit;
    font-size: 0.72rem;
    cursor: pointer;
  }

  #status-bar button:hover { background: var(--amber); color: var(--shelf-dark); }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 24px 18%;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  @media (max-width: 900px) {
    #chat { padding: 18px 6%; }
  }

  .msg {
    max-width: 72%;
    padding: 12px 16px;
    border-radius: 14px;
    line-height: 1.5;
    font-size: 0.98rem;
    white-space: pre-wrap;
  }

  .msg.user {
    align-self: flex-end;
    background: var(--user-bubble);
    color: var(--paper);
    border-bottom-right-radius: 3px;
  }

  .msg.bot {
    align-self: flex-start;
    background: var(--bot-bubble);
    border: 1px solid var(--line);
    border-bottom-left-radius: 3px;
  }

  .msg.error {
    align-self: center;
    background: #fbe4e0;
    border: 1px solid #d98a7d;
    color: #7a2f22;
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 0.82rem;
    max-width: 85%;
  }

  .meta {
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 0.68rem;
    color: #8a9188;
    margin-top: 4px;
  }

  #composer {
    display: flex;
    gap: 10px;
    padding: 16px 18%;
    border-top: 1px solid var(--line);
    background: var(--paper);
  }

  @media (max-width: 900px) {
    #composer { padding: 12px 6%; }
  }

  #composer input {
    flex: 1;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 10px;
    font-family: inherit;
    font-size: 0.98rem;
    background: #fff;
  }

  #composer input:focus { outline: 2px solid var(--amber); outline-offset: 1px; }

  #composer button {
    background: var(--amber);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 0 22px;
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
  }

  #composer button:disabled { background: #cbb99b; cursor: not-allowed; }
  #composer button:not(:disabled):hover { background: var(--amber-dark); }

  .cursor {
    display: inline-block;
    width: 7px;
    height: 1em;
    background: var(--ink);
    margin-left: 2px;
    vertical-align: text-bottom;
    animation: blink 1s step-start infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>

<header>
  <h1>Riverbend Community Library</h1>
  <span class="tag">ASSISTANT</span>
</header>

<div id="status-bar">
  <span id="conn-status">Connecting…</span>
  <span id="session-label"></span>
  <button id="reset-btn">New session</button>
</div>

<div id="chat"></div>

<form id="composer">
  <input id="input" type="text" placeholder="Ask about books, loans, holds, or hours…" autocomplete="off" />
  <button id="send-btn" type="submit" disabled>Send</button>
</form>

<script>
// ---- Configuration -----------------------------------------------------
const WS_URL = "ws://localhost:8000/ws/chat";

// ---- State ---------------------------------------------------------------
let ws = null;
let sessionId = localStorage.getItem("library_session_id") || null;
let currentBotBubble = null;
let currentBotText = "";

const chatEl = document.getElementById("chat");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("send-btn");
const statusEl = document.getElementById("conn-status");
const sessionEl = document.getElementById("session-label");
const resetBtn = document.getElementById("reset-btn");

const WELCOME =
  "Welcome to Riverbend Community Library. I can help with the catalogue, loans and renewals, holds, fines, hours, and memberships. What can I help you with today?";

function setSessionLabel(id) {
  if (!id) {
    sessionEl.textContent = "";
    return;
  }
  sessionEl.textContent = "session " + id.slice(0, 8);
}

function ensureWelcome() {
  if (chatEl.children.length === 0) {
    addMessage("bot", WELCOME);
  }
}

function addMessage(role, text) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.textContent = text;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}

function addMeta(container, text) {
  const meta = document.createElement("div");
  meta.className = "meta";
  meta.textContent = text;
  container.appendChild(meta);
}

function connect() {
  ws = new WebSocket(WS_URL);

  ws.onopen = () => {
    statusEl.textContent = "Connected";
    sendBtn.disabled = false;
    setSessionLabel(sessionId);
    ensureWelcome();
  };

  ws.onclose = () => {
    statusEl.textContent = "Disconnected — retrying in 2s…";
    sendBtn.disabled = true;
    setTimeout(connect, 2000);
  };

  ws.onerror = () => {
    statusEl.textContent = "Connection error";
  };

  ws.onmessage = (event) => {
    let data;
    try {
      data = JSON.parse(event.data);
    } catch {
      return;
    }

    if (data.type === "session") {
      sessionId = data.session_id;
      localStorage.setItem("library_session_id", sessionId);
      setSessionLabel(sessionId);
    } else if (data.type === "token") {
      if (!currentBotBubble) {
        currentBotBubble = addMessage("bot", "");
        currentBotText = "";
      }
      currentBotText += data.content;
      currentBotBubble.textContent = currentBotText;
      chatEl.scrollTop = chatEl.scrollHeight;
    } else if (data.type === "done") {
      if (currentBotBubble) {
        addMeta(currentBotBubble, `TTFT ${data.ttft}s · ${data.tokens_per_sec} tok/s`);
      }
      currentBotBubble = null;
      currentBotText = "";
      sendBtn.disabled = false;
    } else if (data.type === "error") {
      addMessage("error", data.content);
      currentBotBubble = null;
      sendBtn.disabled = false;
    }
  };
}

function sendMessage(text) {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  addMessage("user", text);
  sendBtn.disabled = true;
  ws.send(JSON.stringify({ session_id: sessionId, message: text }));
}

document.getElementById("composer").addEventListener("submit", (e) => {
  e.preventDefault();
  const text = inputEl.value.trim();
  if (!text) return;
  sendMessage(text);
  inputEl.value = "";
});

resetBtn.addEventListener("click", async () => {
  chatEl.innerHTML = "";
  if (sessionId) {
    try {
      const res = await fetch(`http://localhost:8000/session/${sessionId}/reset`, { method: "POST" });
      const data = await res.json();
      sessionId = data.session_id;
      localStorage.setItem("library_session_id", sessionId);
      setSessionLabel(sessionId);
    } catch (e) {
      console.error("Reset failed", e);
    }
  }
  addMessage("bot", "Session reset. Hi again! How can I help you at Riverbend Library today?");
});

connect();
</script>
</body>
</html>
